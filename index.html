<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Links</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>

    <script>
      try {
        const savedTheme = localStorage.getItem("linkpage:theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

        if (savedTheme === "dark" || (savedTheme === null && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {

      }
    </script>
  </head>

  <body class="min-h-screen bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100">

    <button id="theme-toggle" type="button" aria-label="Ganti ke mode gelap"
        class="fixed right-4 top-4 flex h-11 w-11 items-center justify-center rounded-full bg-white text-xl shadow-sm ring-1 ring-slate-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-slate-900 dark:ring-slate-800 dark:focus-visible:outline-indigo-400">🌙</button>

      <div class="mx-auto max-w-md px-4 py-10 md:max-w-xl md:py-16 lg:grid lg:max-w-4xl lg:grid-cols-2 lg:items-start lg:gap-1">
          <div class="lg:sticky lg:top-20">
            <header class="flex flex-col items-center text-center">
              <img
                src="iconS.gif"
                alt="Icon"
                class="h-28 w-28 rounded-full shadow ring-4 ring-white dark:ring-slate-800 md:h-45 md:w-45"
              />
              <h1 class="mt-4 text-2xl font-bold md:text-3xl">Ghea Permana</h1>
              <p class="mt-2 text-sm text-slate-500">
                Software Engineer
              </p>
            </header>

            <nav aria-label="Media social" class="mt-6">
              <ul class="flex justify-center gap-3">
                <li>
                  <a
                    href="https://github.com/Permana-11"
                    aria-label="GitHub"
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-slate-700 text-xl shadow-sm ring-1 ring-slate-200"
                  >
                    <img src="github.svg" alt="GitHub" class="h-5 w-5" />
                  </a>
                </li>
                <li>
                  <a
                    href="https://instagram.com/ghea.permana"
                    aria-label="Instagram"
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-xl shadow-sm ring-1 ring-slate-200"
                  >
                    <img src="insta.svg" alt="Instagram" class="h-5 w-5" />
                  </a>
                </li>
                <li>
                  <a
                    href="https://linkedin.com/in/username"
                    aria-label="LinkedIn"
                    class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-xl shadow-sm ring-1 ring-slate-200"
                  >
                    <img src="lnkdn.svg" alt="LinkedIn" class="h-5 w-5" />
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        <main>
          <h2
            class="mt-8 text-sm font-semibold uppercase tracking-wide text-slate-500 lg:mt-0"
          >
            My Links
          </h2>

          <div id="filter-tabs" class="mt-3 flex flex-wrap gap-2">
            <button type="button" data-category="semua" aria-pressed="true"
                    class="rounded-full bg-white px-4 py-1.5 text-sm font-medium text-slate-700 ring-1 ring-slate-200 aria-pressed:bg-indigo-600 aria-pressed:text-white aria-pressed:ring-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-slate-900 dark:text-slate-200 dark:ring-slate-800 dark:focus-visible:outline-indigo-400">All</button>
            <button type="button" data-category="sosmed" aria-pressed="false"
                    class="rounded-full bg-white px-4 py-1.5 text-sm font-medium text-slate-700 ring-1 ring-slate-200 aria-pressed:bg-indigo-600 aria-pressed:text-white aria-pressed:ring-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-slate-900 dark:text-slate-200 dark:ring-slate-800 dark:focus-visible:outline-indigo-400">Socmed</button>
            <button type="button" data-category="project" aria-pressed="false"
                    class="rounded-full bg-white px-4 py-1.5 text-sm font-medium text-slate-700 ring-1 ring-slate-200 aria-pressed:bg-indigo-600 aria-pressed:text-white aria-pressed:ring-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-slate-900 dark:text-slate-200 dark:ring-slate-800 dark:focus-visible:outline-indigo-400">Project</button>
            <button type="button" data-category="kontak" aria-pressed="false"
                    class="rounded-full bg-white px-4 py-1.5 text-sm font-medium text-slate-700 ring-1 ring-slate-200 aria-pressed:bg-indigo-600 aria-pressed:text-white aria-pressed:ring-indigo-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:bg-slate-900 dark:text-slate-200 dark:ring-slate-800 dark:focus-visible:outline-indigo-400">Contact</button>
          </div>
          <p id="link-count" aria-live="polite" class="mt-4 text-sm text-slate-500" dark:text-slate-400></p>
          <ul id="link-list" class="mt-3 space-y-3"></ul>
          <p id="empty-state" class="mt-3 hidden rounded-xl bg-white px-5 py-4 text-center text-sm text-slate-500 ring-1 ring-slate-200 dark:bg-slate-900 dark:text-slate-400 dark:ring-slate-800"></p>
          <section class="mt-10" aria-labelledby="add-link-heading">
            <h2 id="add-link-heading" class="text-sm font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
        Tambah Link
            </h2>
            <form id="add-link-form" novalidate class="mt-3 space-y-3 rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
              <div>
                  <label for="link-title" class="block text-sm font-medium">Judul</label>
                  <input id="link-title" type="text"
                      class="mt-1 w-full rounded-lg bg-white px-3 py-2 text-sm ring-1 ring-slate-300 focus-visible:outline-2 focus-visible:outline-indigo-600 dark:bg-slate-950 dark:ring-slate-700 dark:focus-visible:outline-indigo-400">
              </div>
              <div>
                  <label for="link-url" class="block text-sm font-medium">URL</label>
                  <input id="link-url" type="text" placeholder="https://..."
                      class="mt-1 w-full rounded-lg bg-white px-3 py-2 text-sm ring-1 ring-slate-300 focus-visible:outline-2 focus-visible:outline-indigo-600 dark:bg-slate-950 dark:ring-slate-700 dark:focus-visible:outline-indigo-400">
              </div>
              <div>
                  <label for="link-category" class="block text-sm font-medium">Kategori</label>
                  <select id="link-category"
                      class="mt-1 w-full rounded-lg bg-white px-3 py-2 text-sm ring-1 ring-slate-300 focus-visible:outline-2 focus-visible:outline-indigo-600 dark:bg-slate-950 dark:ring-slate-700 dark:focus-visible:outline-indigo-400">
                      <option value="sosmed">Sosmed</option>
                      <option value="project">Project</option>
                      <option value="kontak">Kontak</option>
                  </select>
              </div>

              <p id="form-error" role="alert" class="hidden text-sm text-rose-600 dark:text-rose-400"></p>

              <button type="submit"
                  class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 dark:focus-visible:outline-indigo-400">
                  Tambah
              </button>
            </form>
          </section>
        </main>

        <footer class="mt-20 text-center text-xs text-slate-400 lg:col-span-2">
          <p>&copy; 2026 Ghea Permana Universitas Sains Al-Quran</p>
        </footer>
      </div>
      <script src="script.js"></script>
  </body>
</html>
