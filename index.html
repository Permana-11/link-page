<!doctype html>

            <p class="mt-1 text-sm text-slate-500">

          <nav aria-label="Media social" class="mt-6">

              <li>
                <a
                  href="https://github.com/Permana-11"
                  aria-label="GitHub"
                  class="flex h-11 w-11 items-center justify-center rounded-full bg-white text-slate-700 text-x1 shadow-sm ring-1 ring-slate-200"

                  <img src="lnkdn.svg" alt="LinkedIn" class="h-5 w-5" />
